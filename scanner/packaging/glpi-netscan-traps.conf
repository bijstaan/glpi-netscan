# Drop-in that lets the scanner bind the standard SNMP trap port (162).
#
#   install -m 0644 glpi-netscan-traps.conf \
#       /etc/systemd/system/glpi-netscan.service.d/traps.conf
#   systemctl daemon-reload && systemctl restart glpi-netscan
#
# A drop-in rather than a change to the unit, because most installations do not
# receive traps and should not carry the capability that receiving them needs.
# The base unit runs with an empty capability bounding set; this grants exactly
# one capability back, and only the ability to bind ports below 1024 — not to
# read files, change ownership, or anything else.
#
# The alternative, if you would rather grant nothing, is to set a listening port
# above 1024 under Setup > Network scanning and point your devices at it. Some
# hardware cannot be told to send anywhere but 162, which is why this exists.
[Service]
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
