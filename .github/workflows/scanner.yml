# Build the network scanner and its Windows installers.
#
# Two runners, doing two different jobs:
#
#   ubuntu-latest   the release. Static Go binaries for linux/amd64,
#                   linux/arm64, windows/amd64 and windows/arm64, plus the two
#                   .msi installers built with wixl. Cross-compiling is the
#                   point: one host produces everything, so every artifact in a
#                   release came out of the same checkout.
#   windows-latest  nothing is built here. This job exercises what the build
#                   cannot check: that msiexec leaves a service registered
#                   against the `current` junction rather than the versioned
#                   path, that it runs as LocalService and stays stopped when
#                   it has no server to talk to, and that the directory name
#                   matches the version the binary reports.
#
# The scanner runs on Linux and Windows, and on nothing else. It is placed on a
# server or a small always-on box at a site; there is no darwin target in
# build.sh, no macOS package, and no macOS runner here. (Detecting a Mac over
# the wire is a different matter and is unaffected — the scanner identifies
# whatever answers SNMP, including Apple hardware.)

name: scanner

on:
  # The path filter applies to the branch pushes only: GitHub skips paths and
  # paths-ignore entirely for tag pushes, so cutting a v-tag on a commit that
  # happened not to touch scanner/ still builds a release.
  push:
    branches: [master, main]
    paths:
      - 'scanner/**'
      - '.github/workflows/scanner.yml'
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into the binaries and installers
        default: ''

permissions:
  contents: read

jobs:
  # Worked out once, in a shell, rather than in an expression. Everything
  # downstream compares this string against itself — the versioned directory
  # name, the ldflags stamp, the MSI's full_version — so a `v` prefix surviving
  # in one place and not another turns into a failed assertion two jobs later.
  # Tags are stripped to their bare version here and nowhere else.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - id: pick
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            v="$INPUT_VERSION"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            v="${GITHUB_REF#refs/tags/}"
            v="${v#v}"
          else
            v="0.0.0-ci"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "building $v"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: scanner/go.mod
          cache-dependency-path: scanner/go.sum
      # The same four checks the monorepo's GitLab pipeline runs, in the same
      # order, so a change that is green there is green here.
      - name: gofmt, vet, build, test
        working-directory: scanner
        env:
          # Test builds need no VCS stamp, and stamping fails when the
          # checkout's ownership differs from the job user's.
          GOFLAGS: -buildvcs=false
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt"; exit 1; }
          go vet ./...
          go build ./...
          go test ./...

  linux:
    needs: [version, test]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Lifted into the environment because `secrets` is not one of the
      # contexts available to a step's `if:` — `env` is.
      SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
      SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: scanner/go.mod
          cache-dependency-path: scanner/go.sum

      # wixl is a separate package from msitools, which ships msiinfo/msibuild
      # but not wixl itself. build-msi.sh needs all three, and osslsigncode
      # only when a certificate is configured.
      - name: Install the packaging tools
        run: sudo apt-get update && sudo apt-get install -y wixl msitools osslsigncode

      # build.sh takes its version from the environment, not an argument, and
      # builds all four targets in one pass with a .sha256 beside each.
      - name: Build the scanner
        working-directory: scanner
        run: ./build.sh

      # Opt-in. Without a certificate the MSIs come out unsigned, which is fine
      # for CI but SmartScreen warns on them and many fleets refuse unsigned
      # installers outright — so set these two secrets before cutting a tag.
      - name: Prepare the code-signing certificate
        if: env.SIGN_PFX_BASE64 != ''
        run: |
          printf '%s' "$SIGN_PFX_BASE64" | base64 -d > "$RUNNER_TEMP/sign.pfx"
          echo "SIGN_PFX=$RUNNER_TEMP/sign.pfx" >> "$GITHUB_ENV"

      # build-msi.sh asserts the MSI's own contents — secure properties, the
      # versioned directory name, the service account and start type, the
      # custom-action type — and fails rather than shipping a subtly wrong
      # package.
      - name: Build and verify the MSIs
        working-directory: scanner
        run: |
          ./packaging/build-msi.sh "$VERSION" amd64
          ./packaging/build-msi.sh "$VERSION" arm64

      - name: Checksums
        working-directory: scanner
        run: cat dist/"$VERSION"/*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            scanner/dist/${{ needs.version.outputs.version }}/glpi-netscan_*_linux_*
            scanner/dist/${{ needs.version.outputs.version }}/glpi-netscan_*_windows_*.exe
            scanner/dist/${{ needs.version.outputs.version }}/glpi-netscan_*_windows_*.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: scanner/dist/${{ needs.version.outputs.version }}/*.msi*

  windows:
    needs: [version, linux]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: msi
          path: msi

      - name: Locate the MSI
        run: |
          $msi = (Get-ChildItem -Recurse -Filter *_amd64.msi msi | Select-Object -First 1).FullName
          if (-not $msi) { throw "no amd64 MSI in the artifact" }
          "MSI=$msi" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Installed without SERVER/ENROLLSECRET on purpose: that is the path that
      # must leave a registered, idle service rather than one restart-looping
      # against a server it has never been told about.
      - name: Install
        run: |
          $p = Start-Process msiexec -ArgumentList "/i `"$env:MSI`" /qn /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -eq 0) { exit 0 }
          if (-not (Test-Path install.log)) { throw "msiexec exited $($p.ExitCode) and wrote no log" }

          $lines = Get-Content install.log

          # `-Tail 80` on a verbose MSI log shows the property dump and nothing
          # else — the dump is the last thing written and is longer than that.
          # wixl also emits no Error table, so msiexec's own diagnosis degrades
          # to an untranslated "Note: 1: 2262 2: Error". Neither says why. The
          # lines that do are the custom-action return codes and the action
          # that came back with 3, so name those explicitly.
          Write-Host "::group::install.log — the lines that say why"
          $lines | Select-String -Pattern @(
            'returned actual error'
            'Return value 3'
            'Note: 1: 1708'
            'Installation success or error status'
            'Product: .* -- Installation'
            'MainEngineThread is returning'
          ) | ForEach-Object { $_.Line }
          Write-Host "::endgroup::"

          # And the run-up to it, stopping where the property dump begins.
          Write-Host "::group::install.log — the 40 lines before the property dump"
          $dump = $lines | Select-String -Pattern '^Property\(S\):' | Select-Object -First 1
          $end = if ($dump) { $dump.LineNumber - 1 } else { $lines.Count }
          if ($end -gt 0) { $lines[[Math]::Max(0, $end - 40)..($end - 1)] }
          Write-Host "::endgroup::"

          throw "msiexec exited $($p.ExitCode)"

      - name: Check what was installed
        run: |
          $root = "$env:ProgramFiles\GLPI Netscan"
          if (-not (Test-Path "$root\versions\$env:VERSION\glpi-netscan.exe")) { throw "versioned binary missing" }
          if (-not (Test-Path "$root\current\glpi-netscan.exe")) { throw "current junction missing or broken" }

          # sc.exe, not Get-CimInstance Win32_Service. The SCM finishes deleting
          # a service only once the last handle to it is closed, and a WMI query
          # leaves WmiPrvSE holding one — so asking WMI about the service here is
          # enough to make the uninstall in the next step look like it failed.
          # `sc` on its own is an alias for Set-Content, hence sc.exe.
          function Field($text, $name) {
            $m = @($text | Select-String -Pattern "^\s*$name\s*:\s*(.*)$")
            if ($m.Count) { $m[0].Matches[0].Groups[1].Value.Trim() } else { "" }
          }

          $qc = & sc.exe qc GLPINetscan
          if ($LASTEXITCODE -ne 0) { $qc; throw "service not registered" }
          $binPath   = Field $qc 'BINARY_PATH_NAME'
          $startName = Field $qc 'SERVICE_START_NAME'
          $state     = Field (& sc.exe query GLPINetscan) 'STATE'
          Write-Host "service path:  $binPath"
          Write-Host "service state: $state"

          # The bug this guards: ServiceInstall points at the versioned path, so
          # the SCM would keep launching the installed version however many
          # times the scanner updated itself.
          if ($binPath -notlike "*\current\glpi-netscan.exe*") {
            throw "service points at '$binPath' rather than the current junction; self-update would be inert"
          }
          if ($startName -ne "NT AUTHORITY\LocalService") { throw "service runs as $startName, expected LocalService" }
          if ($state -notlike "*STOPPED*") { throw "service was started without credentials (state $state)" }

          # The versioned directory must be named exactly what the binary
          # reports, or the updater will try to 'update' to what is running.
          $reported = (& "$root\current\glpi-netscan.exe" -version) -replace '^glpi-netscan ', ''
          if ($reported -ne $env:VERSION) { throw "binary reports '$reported' but the directory is named '$env:VERSION'" }

      - name: Uninstall
        run: |
          $p = Start-Process msiexec -ArgumentList "/x `"$env:MSI`" /qn /l*v uninstall.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path uninstall.log) {
              Write-Host "::group::uninstall.log — the lines that say why"
              Get-Content uninstall.log | Select-String -Pattern @(
                'returned actual error'
                'Return value 3'
                'Note: 1: 1708'
                'Installation success or error status'
                'Product: .* -- (Removal|Installation)'
                'MainEngineThread is returning'
              ) | ForEach-Object { $_.Line }
              Write-Host "::endgroup::"
            }
            throw "msiexec /x exited $($p.ExitCode)"
          }

          # DeleteServices marks the service for deletion; the SCM removes it when
          # the last handle to it closes, which can be a moment after msiexec has
          # returned. Poll for it to go rather than assume either way, and print
          # what the SCM still thinks if it never does — a service that is really
          # stuck is stuck until a reboot, so 30s is generous, not a race.
          $deadline = (Get-Date).AddSeconds(30)
          while ($true) {
            & sc.exe query GLPINetscan *> $null
            if ($LASTEXITCODE -ne 0) { break }
            if ((Get-Date) -ge $deadline) {
              & sc.exe queryex GLPINetscan
              throw "service survived uninstall"
            }
            Start-Sleep -Milliseconds 500
          }

          if (Test-Path "$env:ProgramFiles\GLPI Netscan\current") { throw "junction survived uninstall" }

      # Kept whatever the outcome, and last in the job so it catches the
      # uninstall too: these logs are the only record of what the deferred
      # custom actions were actually handed, and they are far more useful read
      # whole than re-run guessing at grep patterns.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-logs
          path: |
            install.log
            uninstall.log
          if-no-files-found: ignore

  # Only on a tag, and only once both platforms have agreed. Publishing a
  # package in GLPI asks for a URL, a SHA-256 and a size; attaching the
  # .sha256 files alongside the binaries is what makes the first two real
  # without anyone re-deriving them by hand.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l artifacts
          gh release create "$TAG" artifacts/* \
            --title "$VERSION" \
            --generate-notes
